<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simon's Adventskalender 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{--bg:#fbf6ec;--fg:#1f1d1a;--muted:#5e5a52;--accent:#b3261e;--pine:#1f4d3a;--gold:#b8901c;--card:#fffdf8;
--line:#e6dcc6;--snow:rgba(120,150,180,.35);--dot:rgba(184,144,28,.10);--door-fg:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1a2b;--fg:#eef1f6;--muted:#a9b3c4;--accent:#ff8a80;
--pine:#6cc398;--gold:#e0bf55;--card:#16243a;--line:#2a3a55;--snow:rgba(255,255,255,.55);--dot:rgba(224,191,85,.07)}}
:root[data-theme="dark"]{--bg:#0f1a2b;--fg:#eef1f6;--muted:#a9b3c4;--accent:#ff8a80;--pine:#6cc398;--gold:#e0bf55;
--card:#16243a;--line:#2a3a55;--snow:rgba(255,255,255,.55);--dot:rgba(224,191,85,.07)}
body{margin:0;color:var(--fg);font:16px/1.6 system-ui,sans-serif;background-color:var(--bg);
background-image:radial-gradient(var(--dot) 1.5px,transparent 2px);background-size:28px 28px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:radial-gradient(circle at 20px 30px,var(--snow) 2px,transparent 3px),
radial-gradient(circle at 140px 90px,var(--snow) 3px,transparent 4px),
radial-gradient(circle at 80px 170px,var(--snow) 1.5px,transparent 2.5px);
background-size:200px 200px,260px 260px,180px 180px;animation:snow 30s linear infinite}
@keyframes snow{to{background-position:40px 600px,-30px 780px,20px 540px}}
@media (prefers-reduced-motion: reduce){body::before{animation:none}.flame{animation:none}}
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px}
h1,h2,.door,.footer-note{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:24px 0 16px;border-bottom:3px double var(--gold)}
.door{flex:none;width:76px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:var(--accent);color:var(--door-fg);border:3px solid var(--gold);border-radius:10px 10px 4px 4px;
box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.15);font-size:2.3rem;font-weight:700;line-height:1}
.door small{font:600 .62rem/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.door.finale{background:var(--gold);color:#1f1d1a;border-color:var(--accent)}
.door.finale .star{font-size:1.4rem;margin-bottom:2px}
.headline{flex:1 1 260px;min-width:0}
.date{color:var(--muted);margin:0}
h1{font-size:2rem;line-height:1.2;margin:.2rem 0 0;color:var(--pine)}
.wreath{flex:none;width:150px;height:auto}
.flame{transform-origin:50% 100%;transform-box:fill-box;animation:flicker 1.6s ease-in-out infinite alternate}
@keyframes flicker{0%{transform:scale(1,1)}50%{transform:scale(.92,1.08) rotate(-3deg)}100%{transform:scale(1.04,.95) rotate(2deg)}}
.greeting{font-size:1.1rem;margin:20px 0 0;padding:12px 16px;border-left:4px solid var(--pine);background:var(--card);border-radius:0 8px 8px 0}
.part{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 16px 16px;margin:32px 0 24px;
box-shadow:0 2px 8px rgba(0,0,0,.06);
background-image:linear-gradient(90deg,transparent calc(50% - 7px),var(--accent) calc(50% - 7px),var(--accent) calc(50% + 7px),transparent calc(50% + 7px));
background-size:100% 14px;background-repeat:no-repeat}
.part::before{content:"";position:absolute;top:-18px;left:50%;width:56px;height:30px;transform:translateX(-50%);
background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 30"><path d="M28 15C18 0 4 2 6 12s16 6 22 3z" fill="%23b3261e"/><path d="M28 15C38 0 52 2 50 12s-16 6-22 3z" fill="%23b3261e"/><path d="M28 15l-9 14M28 15l9 14" stroke="%23b3261e" stroke-width="4" stroke-linecap="round"/><circle cx="28" cy="15" r="5" fill="%23c9a227"/></svg>') no-repeat center/contain}
.kicker{margin:0;color:var(--gold);font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center}
h2{font-size:1.5rem;color:var(--accent);margin:.3rem 0 .8rem;text-align:center}
h2::before,h2::after{content:"✦";color:var(--gold);font-size:.8em;margin:0 .45em;vertical-align:.1em}
h3{font-size:1.15rem;color:var(--pine)}
h4{font-size:1rem}
.intro{color:var(--muted)}
.divider{display:flex;justify-content:center;margin:8px 0}
.divider svg{width:220px;max-width:70%;height:auto}
img{max-width:100%;height:auto;display:block;margin:12px auto}
pre{overflow-x:auto;background:#1b1f1c;color:#e2e6e0;padding:12px;border-radius:8px;border-left:4px solid var(--pine);font-size:.9rem}
code{font-family:ui-monospace,monospace}
table{display:block;overflow-x:auto;border-collapse:collapse;max-width:100%;margin:12px 0;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:rgba(31,77,58,.10)}
a{color:var(--accent)}
.puzzle-note{padding:10px 14px;border-left:4px solid var(--gold);background:rgba(184,144,28,.08);border-radius:0 8px 8px 0}
.solution{margin:24px 0 0;background:var(--card);border:1px dashed var(--gold);border-radius:12px;padding:0 16px}
.solution summary{cursor:pointer;padding:14px 0;font-weight:700;color:var(--pine);list-style:none}
.solution summary::-webkit-details-marker{display:none}
.solution summary::before{content:"▸ ";color:var(--gold)}
.solution[open] summary::before{content:"▾ "}
.solution[open]{padding-bottom:16px}
.back{display:inline-block;margin-top:8px;font-weight:600}
.calendar{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-flow:dense;gap:12px;margin:24px 0}
.tile{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-decoration:none;color:#fff;background:#b3261e;border:3px solid #c9a227;border-radius:10px 10px 4px 4px;
box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),0 4px 10px rgba(0,0,0,.18);
font:700 2.2rem/1 "Playfair Display",Georgia,serif;transition:transform .25s ease;transform-origin:left center}
.tile:nth-child(3n+2){background:#1f4d3a}
.tile:nth-child(5n+4){background:#7a1d18}
.tile:hover,.tile:focus-visible{transform:perspective(500px) rotateY(-18deg)}
.tile.big{grid-column:span 2;grid-row:span 2;aspect-ratio:auto;font-size:3.4rem}
.tile.bonus{background:#c9a227;color:#1f1d1a;border-color:#b3261e}
.tile.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){.tile,.tile:hover,.tile:focus-visible{transition:none;transform:none}.tile.shake{animation:none}}
footer{margin:32px 0 16px;padding-top:16px;border-top:3px double var(--gold);text-align:center;color:var(--muted)}
.footer-note{font-size:1.25rem;color:var(--pine);margin:0 0 4px}
</style>
</head>

<script>
(function () {
  var LOCK = true;
  // Alle Türchen sehen gleich aus; erst beim Klick wird geprüft, ob es schon offen sein darf
  document.querySelectorAll('.tile').forEach(function (t) {
    t.addEventListener('click', function (e) {
      if (LOCK && Date.now() < +t.dataset.unlock) {
        e.preventDefault();
        t.classList.remove('shake');
        void t.offsetWidth;  // Animation neu starten
        t.classList.add('shake');
      }
    });
  });
})();
</script>
